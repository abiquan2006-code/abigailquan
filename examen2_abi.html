<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen_2</title>
    
    <style>
       
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

       
        .container {
            background-color: #ffffff;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .container h2 {
            margin: 0;
            color: #3498db;
        }

        
        .form-group {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        
        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.95rem;
        }

        
        .form-group input[type="text"] {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

       
        .form-group input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
    </style>
</head>
<body>

    <h1>Examen Práctico 2</h1>

    <div class="container">
        <h2>Hola Profe Heber</h2>
    </div>

    <div class="form-group">
        <label for="nombre">Introduzca su nombre</label>
        <input type="text" id="nombre">
    </div>

    <div class="form-group">
        <label for="nota">Introduzca la nota obtenida</label>
        <input type="text" id="nota">
    </div>

</body>
</html>
